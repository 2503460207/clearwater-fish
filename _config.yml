# 我的第一篇博客
Hello！欢迎来到我的个人博客～

这是我用GitHub Pages + Jekyll搭建的第一篇博客，终于迈出了博客创作的第一步！

## 为什么选择GitHub Pages建博客？
1. **免费**：无需服务器，GitHub提供免费的静态网页托管服务；
2. **简单**：用Markdown写内容，不用复杂的网页开发知识；
3. **灵活**：可以通过Jekyll主题自定义博客样式，后续还能不断优化。

